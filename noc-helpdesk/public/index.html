<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SYNOC — NOC Helpdesk System. Ticket management, SLA monitoring, and master data." />
  <title>SYNOC — NOC Helpdesk</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛</text></svg>" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- ================= LOGIN ================= -->
  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <div class="login-brand">
        <span class="logo-mark">⚛</span>
        <div>
          <h1>SYNOC</h1>
          <p>NOC Helpdesk System</p>
        </div>
      </div>
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" id="loginUsername" autocomplete="username" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" id="loginPassword" autocomplete="current-password" required />
      </label>
      <p id="loginError" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Masuk</button>
      <div class="login-hint">
        <strong>Demo:</strong> admin/admin123 · noc/noc123 · engineer/engineer123
      </div>
    </form>
  </div>

  <!-- ================= APP ================= -->
  <div id="appShell" class="app-shell" hidden>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="logo-mark">⚛</span>
        <div>
          <strong>SYNOC</strong>
          <small>NOC Helpdesk</small>
        </div>
      </div>

      <nav class="nav" id="mainNav">
        <button class="nav-item active" data-view="dashboard"><span>◈</span> Dashboard</button>
        <button class="nav-item" data-view="tickets"><span>🎫</span> Tickets</button>
        <button class="nav-item" data-view="ticket-new"><span>＋</span> Ticket Baru</button>
        <button class="nav-item" data-view="sla"><span>⏱</span> SLA &amp; Prioritas</button>
        <div class="nav-group">Master Data</div>
        <button class="nav-item" data-view="master" data-resource="service_type"><span>▤</span> Jenis Layanan</button>
        <button class="nav-item" data-view="master" data-resource="priority"><span>⚑</span> Prioritas</button>
        <button class="nav-item" data-view="master" data-resource="channel"><span>✉</span> Kanal Pelaporan</button>
        <button class="nav-item" data-view="master" data-resource="customer"><span>🏢</span> Customer</button>
        <button class="nav-item" data-view="master" data-resource="isp"><span>🌐</span> ISP</button>
        <button class="nav-item" data-view="master" data-resource="pop"><span>📍</span> POP</button>
        <button class="nav-item" data-view="master" data-resource="ms_splitter"><span>🔌</span> MS / Splitter</button>
        <button class="nav-item" data-view="master" data-resource="link"><span>🔗</span> Link</button>
        <button class="nav-item" data-view="master" data-resource="sla_policy"><span>📋</span> Kebijakan SLA</button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <span class="avatar" id="userAvatar">?</span>
          <div>
            <strong id="userName">—</strong>
            <small id="userRole">—</small>
          </div>
        </div>
        <button class="btn btn-ghost btn-block btn-sm" id="logoutBtn">Keluar</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <span class="live-dot" id="liveDot" title="API tersambung"></span>
          <button class="btn btn-primary btn-sm" id="refreshBtn">⟳ Refresh</button>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- ================= MODAL ================= -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <header class="modal-head">
        <h3 id="modalTitle">Detail</h3>
        <button class="icon-btn" id="modalClose" aria-label="Tutup">✕</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./app.js" type="module"></script>
</body>
</html>
