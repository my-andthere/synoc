<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SYNOC — NOC Helpdesk System. Ticket management, SLA monitoring, and master data." />
  <title>SYNOC — NOC Helpdesk</title>
  <link rel="icon" type="image/svg+xml" href="./vendor/bootstrap-icons/favicon.svg" />  <link rel="stylesheet" href="./vendor/bootstrap-icons/bootstrap-icons.min.css" />  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- ================= LOGIN ================= -->
  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <div class="login-brand">
        <span class="logo-mark"><i class="bi bi-cpu"></i></span>
        <div>
          <h1>SYNOC</h1>
          <p>NOC Helpdesk System</p>
        </div>
      </div>
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" id="loginUsername" autocomplete="username" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" id="loginPassword" autocomplete="current-password" required />
      </label>
      <p id="loginError" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Masuk</button>
      <div class="login-hint">
        <span class="login-hint-label">Pilih akun demo</span>
        <div class="demo-accounts" id="demoAccounts">
          <button type="button" class="demo-btn" data-username="admin" data-password="admin123" data-role="Administrator">
            <i class="bi bi-person-badge"></i>
            <span class="demo-btn-name">admin</span>
            <small>Administrator</small>
          </button>
          <button type="button" class="demo-btn" data-username="noc" data-password="noc123" data-role="NOC Operator">
            <i class="bi bi-headset"></i>
            <span class="demo-btn-name">noc</span>
            <small>NOC Operator</small>
          </button>
          <button type="button" class="demo-btn" data-username="engineer" data-password="engineer123" data-role="Field Engineer">
            <i class="bi bi-tools"></i>
            <span class="demo-btn-name">engineer</span>
            <small>Field Engineer</small>
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- ================= APP ================= -->
  <div id="appShell" class="app-shell" hidden>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="logo-mark"><i class="bi bi-cpu"></i></span>
        <div>
          <strong>SYNOC</strong>
          <small>NOC Helpdesk</small>
        </div>
      </div>

      <nav class="nav" id="mainNav">
        <button class="nav-item active" data-view="dashboard"><span><i class="bi bi-speedometer2"></i></span> Dashboard</button>
        <button class="nav-item" data-view="tickets"><span><i class="bi bi-ticket-perforated"></i></span> Tickets</button>
        <button class="nav-item" data-view="ticket-new"><span><i class="bi bi-plus-lg"></i></span> Ticket Baru</button>
        <button class="nav-item" data-view="sla"><span><i class="bi bi-stopwatch"></i></span> SLA &amp; Prioritas</button>
        <div class="nav-group">Master Data</div>
        <button class="nav-item" data-view="master" data-resource="service_type"><span><i class="bi bi-diagram-3"></i></span> Jenis Layanan</button>
        <button class="nav-item" data-view="master" data-resource="priority"><span><i class="bi bi-flag"></i></span> Prioritas</button>
        <button class="nav-item" data-view="master" data-resource="channel"><span><i class="bi bi-envelope"></i></span> Kanal Pelaporan</button>
        <button class="nav-item" data-view="master" data-resource="branch"><span><i class="bi bi-diagram-2"></i></span> Cabang</button>
        <button class="nav-item" data-view="master" data-resource="pic"><span><i class="bi bi-person-badge"></i></span> PIC</button>
        <button class="nav-item" data-view="master" data-resource="customer"><span><i class="bi bi-building"></i></span> Customer</button>
        <button class="nav-item" data-view="master" data-resource="isp"><span><i class="bi bi-globe"></i></span> ISP</button>
        <button class="nav-item" data-view="master" data-resource="pop"><span><i class="bi bi-geo-alt"></i></span> POP</button>
        <button class="nav-item" data-view="master" data-resource="ms_splitter"><span><i class="bi bi-usb-plug"></i></span> MS / Splitter</button>
        <button class="nav-item" data-view="master" data-resource="link"><span><i class="bi bi-link-45deg"></i></span> Link</button>
        <button class="nav-item" data-view="master" data-resource="sla_policy"><span><i class="bi bi-list-check"></i></span> Kebijakan SLA</button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <span class="avatar" id="userAvatar">?</span>
          <div>
            <strong id="userName">—</strong>
            <small id="userRole">—</small>
          </div>
        </div>
        <button class="btn btn-ghost btn-block btn-sm" id="logoutBtn">Keluar</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <span class="live-dot" id="liveDot" title="API tersambung"></span>
          <button class="btn btn-primary btn-sm" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- ================= MODAL ================= -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <header class="modal-head">
        <h3 id="modalTitle">Detail</h3>
        <button class="icon-btn" id="modalClose" aria-label="Tutup"><i class="bi bi-x-lg"></i></button>
      </header>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./app.js" type="module"></script>
</body>
</html>
